<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0F1020">
<title>Panel Panitia OSIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: layar hasil untuk TV (kartu foto 4 kolom, skor besar, bilah perbandingan, notifikasi suara di kanan atas) dan panel pengelola untuk panitia setelah login. Layar hasil selalu gelap agar jelas dari jauh. */
:root {
  color-scheme: light;
  --bg: #F2F3F8;
  --surface: #FFFFFF;
  --fg: #15152B;
  --muted: #5B5D78;
  --line: #D5D7E4;
  --ink: #3A2C96;
  --ink-fg: #FFFFFF;
  --ink-soft: #E4E2F4;
  --ok: #1F7A4D;
  --bad: #B3261E;
  --warn: #8F5600;
  --p1: #4338CA;
  --p2: #0E7C86;
  --p3: #B45309;
  --p4: #A21CAF;
  --pfg: #FFFFFF;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0F1020; --surface: #181A30; --fg: #ECEDF7; --muted: #9EA1BF; --line: #2D3052;
    --ink: #A599FF; --ink-fg: #14102E; --ink-soft: #26224E; --ok: #5CCB93; --bad: #FF8A80; --warn: #E0A94A;
    --p1: #8B93FF; --p2: #35C4D0; --p3: #F2A44B; --p4: #E879F9; --pfg: #14102E;
  }
}
body.dark {
  color-scheme: dark;
  --bg: #0B0C1A; --surface: #15172C; --fg: #F1F2FB; --muted: #A3A6C4; --line: #2A2D52;
  --ink: #A599FF; --ink-fg: #14102E; --ink-soft: #26224E; --ok: #5CCB93; --bad: #FF8A80; --warn: #E0A94A;
  --p1: #8B93FF; --p2: #35C4D0; --p3: #F2A44B; --p4: #E879F9; --pfg: #14102E;
}

* { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0; min-height: 100%; display: flex; flex-direction: column;
  background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body);
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { flex: 1; width: 100%; max-width: 1840px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; min-height: 0; }
body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; background: var(--logo) center / min(86vmin, 820px) no-repeat; opacity: .08; }
.wrap { position: relative; z-index: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.eyebrow { margin: 0 0 2px; font-size: .78rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(2.2rem, 6vw, 3.4rem); line-height: .92; text-transform: uppercase; text-wrap: balance; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 3px 12px; border: 1.5px solid currentColor; border-radius: 999px; font-size: .82rem; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.pill.open { color: var(--ok); }
.pill.closed { color: var(--bad); }

/* ===== Layar hasil (TV) ===== */
.tvwrap { flex: 1; display: flex; flex-direction: column; gap: clamp(10px, 2vh, 22px); min-height: 0; }
.tvhead { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 28px; padding-right: min(34vw, 660px); }
@media (max-width: 900px) { .tvhead { padding-right: 0; padding-top: 70px; } }
.tvhead > div { min-width: 0; }
.tvlogo { height: clamp(56px, 9.5vh, 110px); width: auto; aspect-ratio: 1; flex: none; align-self: center; }
.hlogo { position: absolute; right: 0; top: 0; height: 60px; width: auto; aspect-ratio: 1; }
.tvhead h1 { font-size: clamp(2.2rem, 5.2vw, 5rem); }
.tvhead .eyebrow { font-size: clamp(.75rem, 1.15vw, 1.15rem); }
.tvbottom { display: flex; align-items: center; gap: clamp(12px, 2vw, 32px); }
.tvbottom .share { flex: 1; min-width: 0; }
.tvbottom .pill { font-size: clamp(.85rem, 1.4vw, 1.4rem); }
.totalbox { display: grid; justify-items: start; line-height: 1; }
.totalbox small { font-size: clamp(.75rem, 1.2vw, 1.2rem); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.totalbox b { font-family: var(--display); font-weight: 800; font-size: clamp(2.2rem, 4.4vw, 4.6rem); font-variant-numeric: tabular-nums; }
.tvgrid { flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(10px, 1.6vw, 26px); min-height: 0; }
@media (max-width: 900px) { .tvgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tfoto { min-height: 160px; } }
.tcard { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; overflow: hidden; }
.tfoto { position: relative; display: block; flex: 1; min-height: 80px; background: var(--ink-soft); }
.tfoto .foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
.ph svg { width: 34%; max-width: 180px; height: auto; }
.chip { position: absolute; left: 12px; top: 12px; display: grid; justify-items: center; line-height: 1; padding: 8px 16px 6px; border-radius: 10px; background: var(--pc); color: var(--pfg); }
.chip small { font-size: clamp(.55rem, .9vw, .9rem); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.chip b { font-family: var(--display); font-weight: 800; font-size: clamp(2.2rem, 5vw, 5rem); line-height: .9; }
.tbody { display: grid; gap: 2px; padding: clamp(8px, 1.6vh, 18px) clamp(12px, 1.3vw, 22px) clamp(12px, 2vh, 22px); }
.trole { font-size: clamp(.65rem, .95vw, .95rem); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 4px 0 0; }
.tname { margin: 0; font-weight: 700; font-size: clamp(1rem, 1.7vw, 1.9rem); line-height: 1.15; overflow-wrap: anywhere; }
.tname.empty { color: var(--muted); font-weight: 400; font-style: italic; }
.score { display: flex; align-items: baseline; gap: 10px; margin-top: clamp(10px, 2vh, 22px); }
.score b { display: inline-block; font-family: var(--display); font-weight: 800; font-size: clamp(3.2rem, min(8vw, 15vh), 9rem); line-height: .9; color: var(--pc); font-variant-numeric: tabular-nums; transform-origin: left bottom; }
.score b.bump { animation: bump .7s ease-out; }
.score span { font-size: clamp(.9rem, 1.4vw, 1.5rem); color: var(--muted); font-weight: 600; }
.pct { margin: 0; font-size: clamp(1rem, 1.7vw, 1.8rem); font-weight: 700; font-variant-numeric: tabular-nums; }
.tbar { height: clamp(8px, 1.4vh, 16px); border-radius: 999px; background: var(--ink-soft); overflow: hidden; margin-top: 6px; }
.tfill { height: 100%; background: var(--pc); border-radius: 999px; transition: width .6s ease; }
@keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.22); } 100% { transform: scale(1); } }
.share { display: flex; min-height: clamp(34px, 5vh, 56px); border-radius: 999px; overflow: hidden; background: var(--ink-soft); gap: 3px; }
.seg { display: grid; place-items: center; min-width: 0; font-weight: 700; font-size: clamp(.8rem, 1.4vw, 1.4rem); color: var(--pfg); background: var(--pc); transition: flex-grow .6s ease; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.share .empty { flex: 1; display: grid; place-items: center; color: var(--muted); font-weight: 600; }
.tvfoot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; }
.tvlogin { color: var(--muted); font-size: .85rem; text-decoration: underline; }

/* ===== Notifikasi suara masuk ===== */
#toasts {
  position: fixed; z-index: 40; display: grid; gap: 10px; justify-items: end; pointer-events: none;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  right: max(16px, env(safe-area-inset-right, 0px));
  width: min(calc(100vw - 32px), clamp(320px, 34vw, 640px));
}
.toast {
  width: 100%; padding: clamp(12px, 1.6vh, 20px) clamp(14px, 1.4vw, 24px); border-radius: 12px;
  background: var(--pc); color: var(--pfg); font-size: clamp(1rem, 1.5vw, 1.55rem); line-height: 1.3;
  box-shadow: 0 8px 28px rgba(0, 0, 0, .35); animation: tin .35s ease-out;
}
.toast b { font-weight: 800; }
.toast.out { opacity: 0; transform: translateX(24px); transition: opacity .4s ease, transform .4s ease; }
@keyframes tin { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }

/* ===== Panel panitia ===== */
.head { position: relative; padding-right: 76px; border-bottom: 3px double var(--fg); padding-bottom: 14px; display: grid; gap: 6px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; color: var(--muted); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); align-items: center; }
.tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; margin-bottom: -1px; min-height: 44px; font: 600 .95rem var(--body); color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--ink); }
.back { color: var(--ink); font-weight: 600; text-decoration: underline; padding: 10px 6px; background: none; border: 0; font-family: var(--body); font-size: 1rem; cursor: pointer; }
.tabs .push { margin-left: auto; }
.panel, .note { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
.note strong { display: block; color: var(--warn); margin-bottom: 2px; }
.btn { appearance: none; min-height: 44px; padding: 10px 18px; border-radius: 8px; font: 600 .95rem var(--body); cursor: pointer; border: 2px solid var(--line); background: var(--surface); color: var(--fg); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--ink-fg); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.dangerfill { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.fine { font-size: .85rem; color: var(--muted); margin: 0; }
.errtext { margin: 0; color: var(--bad); font-weight: 600; }
.okt { color: var(--ok); font-weight: 600; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.stack { display: grid; gap: 16px; }
.cols { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.cols > * { min-width: 0; }
.panel h2 { margin: 0 0 8px; font-family: var(--display); font-weight: 800; font-size: 1.7rem; line-height: 1; text-transform: uppercase; }
.panel h3 { margin: 0; font-size: 1rem; }
.results { display: grid; }
.row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .n { font-family: var(--display); font-weight: 800; font-size: 2.8rem; line-height: .85; color: var(--pc); }
.row .who { font-weight: 600; overflow-wrap: anywhere; }
.row .cnt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.15rem; }
.row .cnt small { display: block; font-weight: 500; font-size: .8rem; color: var(--muted); }
.track { grid-column: 2 / 4; height: 12px; border-radius: 999px; background: var(--ink-soft); overflow: hidden; }
.fill { height: 100%; background: var(--pc); border-radius: 999px; transition: width .5s ease; }
.totalline { margin: 8px 0 0; color: var(--muted); font-variant-numeric: tabular-nums; }
.line { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.line > div { min-width: 0; }
.dz { border-color: var(--bad); display: grid; gap: 10px; }
.dz h3 { color: var(--bad); }
.form { display: grid; gap: 16px; }
.two { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .two { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pair { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px 16px; display: grid; gap: 10px; }
.pair legend { font-family: var(--display); font-weight: 800; font-size: 1.4rem; padding: 0 6px; text-transform: uppercase; color: var(--pc); }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: .82rem; font-weight: 600; color: var(--muted); }
input[type="text"], input[type="email"], input[type="password"] { width: 100%; font: 400 1rem var(--body); color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 44px; }
.fotorow { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: start; }
.pv { position: relative; width: 96px; aspect-ratio: 4 / 5; border-radius: 8px; overflow: hidden; background: var(--ink-soft); color: var(--muted); display: grid; place-items: center; font-size: .75rem; text-align: center; }
.pv img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.fotoact { display: grid; gap: 6px; min-width: 0; }
input[type="file"] { max-width: 100%; font: 400 .85rem var(--body); color: var(--fg); }
.savebar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 14px; }
.login { max-width: 420px; margin: 8px auto 0; width: 100%; }
.center { flex: 1; display: grid; place-content: center; text-align: center; padding: 24px; }

#fsHint {
  position: fixed; z-index: 35; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  padding: 6px 14px; border-radius: 999px; font-size: .85rem; font-weight: 600;
  background: var(--fg); color: var(--bg); opacity: .85; pointer-events: none; white-space: nowrap;
}
#fsHint[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) { .score b.bump, .toast { animation: none; } .tfill, .seg, .fill { transition: none; } }
</style>
</head>

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function safeImg(d) {
  return (typeof d === "string" && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(d)) ? d : "";
}
function fmtTime(iso) {
  try { return new Date(iso).toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" }); } catch (e) { return ""; }
}

let db = null, auth = null;
const S = {
  status: "loading",
  cfg: null, fotos: ["", "", "", ""], open: true, reset: null,
  votes: null, votesLoaded: false, shown: null,
  isAdmin: false, tab: "ringkas", busy: false,
  aerr: "", lerr: "", lemail: "", wipe: false, dberr: ""
};

function cfg() {
  const c = S.cfg || {};
  return {
    sekolah: c.sekolah || "Nama Sekolah",
    periode: c.periode || "2026/2027",
    paslon: [0, 1, 2, 3].map(function (i) {
      const x = (c.paslon || [])[i] || {};
      return { ketua: x.ketua || "" };
    })
  };
}
function liveCounts() {
  const c = [0, 0, 0, 0];
  (S.votes || []).forEach(function (v) {
    const n = Number(v.paslon);
    if (n >= 1 && n <= 4) c[n - 1]++;
  });
  return c;
}
function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }
function pairName(p) {
  return p.ketua ? esc(p.ketua) : '<span class="muted">Nama belum diisi</span>';
}
function plainName(p) {
  return p.ketua || "(nama belum diisi)";
}
function route() {
  const h = location.hash;
  if (h === "#tampil") return "tampil";
  if (h === "#masuk") return S.isAdmin ? "panel" : "login";
  return S.isAdmin ? "panel" : "tampil";
}

/* ---------- layar penuh ---------- */
const fsOK = !!document.documentElement.requestFullscreen;
const hint = document.getElementById("fsHint");
function inFS() {
  return !!document.fullscreenElement ||
    (window.matchMedia && window.matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches);
}
function updateHint() { hint.hidden = !fsOK || inFS(); }
let audioCtx = null;
document.addEventListener("click", function () {
  if (fsOK && !document.fullscreenElement) {
    try {
      const p = document.documentElement.requestFullscreen({ navigationUI: "hide" });
      if (p && p.catch) p.catch(function () {});
    } catch (e) { /* abaikan */ }
  }
  if (!audioCtx) {
    try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); } catch (e) { /* abaikan */ }
  }
  if (audioCtx && audioCtx.state === "suspended") { try { audioCtx.resume(); } catch (e) { /* abaikan */ } }
}, true);
document.addEventListener("fullscreenchange", updateHint);
updateHint();

/* ---------- notifikasi suara masuk ---------- */
const toastBox = document.getElementById("toasts");
function ping() {
  if (!audioCtx || audioCtx.state !== "running") return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.45);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.5);
  } catch (e) { /* abaikan */ }
}
function toast(n) {
  if (!(n >= 1 && n <= 4)) return;
  const p = cfg().paslon[n - 1];
  const el = document.createElement("div");
  el.className = "toast";
  el.style.setProperty("--pc", "var(--p" + n + ")");
  el.setAttribute("role", "status");
  el.innerHTML = 'Paslon nomor <b>' + n + '</b> atas nama <b>' + esc(plainName(p)) + '</b> mendapat <b>1 suara</b>';
  toastBox.appendChild(el);
  while (toastBox.children.length > 5) toastBox.removeChild(toastBox.firstChild);
  ping();
  setTimeout(function () { el.classList.add("out"); }, 6500);
  setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 7000);
}

/* ---------- layar hasil (TV) ---------- */
function dbNote() {
  if (!S.dberr) return "";
  const t = S.dberr === "permission-denied"
    ? "Aturan Firestore menolak akses. Pasang aturan di Firebase, lalu muat ulang halaman."
    : "Firestore belum bisa dihubungi. Pastikan Firestore Database sudah dibuat di proyek Firebase.";
  return '<div class="note" role="alert"><strong>Tidak terhubung ke database</strong>' + esc(t) + ' (kode: ' + esc(S.dberr) + ')</div>';
}
function viewTampil(C) {
  const counts = liveCounts(), total = sum(counts);
  const bump = [false, false, false, false];
  if (S.shown) counts.forEach(function (c, i) { if (c > S.shown[i]) bump[i] = true; });
  S.shown = counts.slice();

  let h = '<div class="tvwrap"><header class="tvhead"><img class="tvlogo" src="' + LOGO + '" alt="Logo OSIS SMPN 8 Tarakan"><div><p class="eyebrow">Penghitungan suara langsung · ' + esc(C.sekolah) + ' · Periode ' + esc(C.periode) + '</p>' +
    '<h1>Pemilihan Ketua OSIS</h1></div></header>' + dbNote() + '<div class="tvgrid">';

  C.paslon.forEach(function (p, i) {
    const n = i + 1, img = safeImg(S.fotos[i]), pct = total ? (counts[i] / total) * 100 : 0;
    h += '<article class="tcard" style="--pc:var(--p' + n + ')">' +
      '<div class="tfoto">' + (img ? '<img class="foto" src="' + img + '" alt="Foto Paslon ' + n + '">' : '<span class="ph" aria-hidden="true">' + PERSON + '</span>') +
      '<span class="chip"><small>Paslon</small><b>' + n + '</b></span></div>' +
      '<div class="tbody">' +
        '<p class="trole">Ketua</p><p class="tname' + (p.ketua ? "" : " empty") + '">' + esc(p.ketua || "Belum diisi") + '</p>' +
        '<div class="score"><b class="' + (bump[i] ? "bump" : "") + '">' + counts[i] + '</b><span>suara</span></div>' +
        '<p class="pct">' + pct.toFixed(1).replace(".", ",") + '%</p>' +
        '<div class="tbar" role="img" aria-label="Paslon ' + n + ': ' + counts[i] + ' suara"><div class="tfill" style="width:' + pct.toFixed(2) + '%"></div></div>' +
      '</div></article>';
  });
  h += '</div><div class="tvbottom"><div class="totalbox"><small>Total suara</small><b>' + total + '</b></div><div class="share" role="img" aria-label="Perbandingan suara empat paslon">';
  if (total) {
    counts.forEach(function (c, i) {
      if (!c) return;
      const pct = (c / total) * 100;
      h += '<span class="seg" style="flex-grow:' + c + ';flex-basis:0;--pc:var(--p' + (i + 1) + ')">' + (pct >= 7 ? (i + 1) + " · " + pct.toFixed(0) + "%" : "") + '</span>';
    });
  } else {
    h += '<span class="empty">Belum ada suara masuk</span>';
  }
  return h + '</div><span class="pill ' + (S.open ? "open" : "closed") + '">' + (S.open ? "Suara dibuka" : "Suara ditutup") + '</span></div><div class="tvfoot"><a class="tvlogin" href="#masuk">Masuk panitia</a></div></div>';
}

function ringkasHTML(C) {

  let h = '<div class="cols"><section class="panel"><h2>Skor sementara</h2>' + rowsHTML(C, counts, total) +

  h += '<div class="stack"><section class="panel stack"><div class="line"><div><h3>Pemungutan suara</h3><p class="fine">Status sekarang: ' + (S.open ? "dibuka" : "ditutup") + '. Saat ditutup, bilik menampilkan pesan penutupan.</p></div>' +
    '<button type="button" class="btn ' + (S.open ? "danger" : "primary") + '" data-act="toggle"' + (S.busy ? " disabled" : "") + '>' + (S.open ? "Tutup pemungutan suara" : "Buka pemungutan suara") + '</button></div></section>';

  h += '<section class="panel dz"><h3>Reset darurat</h3><p class="fine">Menghapus semua suara dan mengembalikan semua skor ke 0. Pakai hanya saat ada kejadian darurat. Tidak bisa dibatalkan.</p>';
  if (S.reset && S.reset.at) h += '<p class="fine">Terakhir direset: ' + esc(fmtTime(S.reset.at)) + ' (' + esc(S.reset.count) + ' suara dihapus)</p>';
  if (!S.wipe) {
    h += '<div class="acts"><button type="button" class="btn danger" data-act="wipe"' + ((S.busy || !total) ? " disabled" : "") + '>Reset semua suara (' + total + ')</button></div>';
  } else {
    h += '<div class="field"><label for="wipe-in">Ketik RESET untuk mengonfirmasi. ' + total + ' suara akan dihapus.</label><input id="wipe-in" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>' +
      '<div class="acts"><button type="button" class="btn" data-act="wipe-no"' + (S.busy ? " disabled" : "") + '>Batal</button>' +
      '<button type="button" class="btn dangerfill" id="wipe-go" data-act="wipe-yes" disabled>' + (S.busy ? "Menghapus…" : "Ya, reset sekarang") + '</button></div>';
  }
  if (S.aerr) h += '<p class="errtext" role="alert">' + esc(S.aerr) + '</p>';
  return h + '</section></div></div>';
}
function pvHTML(i) {
  const img = safeImg(S.fotos[i]);
  return img ? '<img src="' + img + '" alt="Foto Paslon ' + (i + 1) + '">' : "Belum ada foto";
}
function aturHTML(C) {
  let h = '<form class="form" id="formAtur" autocomplete="off"><section class="panel two">' +
    '<div class="field"><label for="f-sekolah">Nama sekolah</label><input id="f-sekolah" type="text" maxlength="80" value="' + esc(S.cfg && S.cfg.sekolah || "") + '" placeholder="Nama sekolah"></div>' +
    '<div class="field"><label for="f-periode">Periode</label><input id="f-periode" type="text" maxlength="20" value="' + esc(C.periode) + '"></div></section><div class="two">';
  C.paslon.forEach(function (p, i) {
    const n = i + 1;
    h += '<fieldset class="pair" style="--pc:var(--p' + n + ')"><legend>Paslon ' + n + '</legend>' +
      '<div class="field"><label for="k' + n + '">Calon Ketua</label><input id="k' + n + '" type="text" maxlength="60" value="' + esc(p.ketua) + '"></div>' +
      '<div class="fotorow"><div class="pv" id="pv-' + n + '">' + pvHTML(i) + '</div>' +
      '<div class="fotoact"><label class="fine" for="ft-' + n + '">Foto Paslon ' + n + ' (otomatis dipotong 4:5)</label>' +
      '<input id="ft-' + n + '" type="file" accept="image/*" data-foto="' + n + '">' +
      '<button type="button" class="btn" data-act="delfoto" data-n="' + n + '"' + (safeImg(S.fotos[i]) ? "" : " hidden") + ' id="del-' + n + '">Hapus foto</button>' +
      '<p class="fine" id="pm-' + n + '" role="status">Foto langsung tersimpan setelah dipilih.</p></div></div></fieldset>';
  });
  return h + '</div><div class="savebar"><p id="atur-msg" class="fine" role="status">Nama baru tampil di bilik setelah disimpan.</p>' +
    '<button type="submit" class="btn primary" id="btn-save">Simpan nama paslon</button></div></form>';
}
function viewPanel(C) {
  return '<header class="head"><img class="hlogo" src="' + LOGO + '" alt="Logo OSIS"><p class="eyebrow">Panel panitia · Periode ' + esc(C.periode) + '</p><h1>Pemilihan Ketua OSIS</h1>' +
    '<div class="meta"><span>' + esc(C.sekolah) + '</span><span class="pill ' + (S.open ? "open" : "closed") + '">' + (S.open ? "Dibuka" : "Ditutup") + '</span></div></header>' +
    '<nav class="tabs" role="tablist" aria-label="Panel panitia">' +
    [["ringkas", "Ringkasan"], ["atur", "Atur"]].map(function (t) {
      return '<button type="button" role="tab" class="tab" data-act="tab" data-tab="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + '</button>';
    }).join("") +
    '<a class="back push" href="#tampil">Layar hasil</a><a class="back" href="' + BILIK_URL + '">Bilik suara</a><button type="button" class="back" data-act="logout">Keluar</button></nav>' +
    dbNote() + (S.tab === "atur" ? aturHTML(C) : ringkasHTML(C));
}

function render() {
  if (S.status === "loading") { app.innerHTML = '<div class="center"><p class="muted" style="margin:0">Memuat…</p></div>'; return; }
  const r = route();
  document.body.classList.toggle("dark", r === "tampil");
  const C = cfg();
  app.innerHTML = r === "panel" ? viewPanel(C) : (r === "login" ? viewLogin() : viewTampil(C));
}
let queued = false;
function renderSoon() {
  if (queued) return;
  queued = true;
  requestAnimationFrame(function () {
    queued = false;
    const r = route();
    if ((r === "panel" && S.tab === "atur") || r === "login") return;   /* jangan hapus isian yang sedang diketik */
    if (r === "panel" && S.wipe) return;
    render();
  });
}

/* ---------- aksi ---------- */
function timeout(ms) {
  return new Promise(function (_, rej) { setTimeout(function () { rej({ code: "timeout" }); }, ms); });
}
function errMsg(e) {
  if (e && e.code === "permission-denied") return "Ditolak oleh aturan Firestore. Pastikan sudah masuk sebagai panitia dan aturan terpasang.";
  return "Tidak ada jawaban dari Firebase. Pastikan Firestore sudah dibuat dan internet aktif.";
}
async function adminDo(fn) {
  if (S.busy) return;
  S.busy = true; S.aerr = ""; render();
  try { await fn(); } catch (e) { S.aerr = errMsg(e); }
  S.busy = false; render();
}
async function saveCfg() {
  const g = function (id) { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
  const paslon = [1, 2, 3, 4].map(function (n) { return { ketua: g("k" + n) }; });
  const msg = document.getElementById("atur-msg"), btn = document.getElementById("btn-save");
  if (btn) btn.disabled = true;
  try {
    await Promise.race([setDoc(doc(db, "config", "paslon"), { sekolah: g("f-sekolah"), periode: g("f-periode") || "2026/2027", paslon: paslon }), timeout(10000)]);
    if (msg) { msg.textContent = "Tersimpan."; msg.className = "okt"; }
  } catch (e) {
    if (msg) { msg.textContent = errMsg(e); msg.className = "errtext"; }
  }
  if (btn) btn.disabled = false;
}
function toJpeg(file) {
  return new Promise(function (resolve, reject) {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      const W = 480, H = 600, c = document.createElement("canvas");
      c.width = W; c.height = H;
      const x = c.getContext("2d"), r = Math.max(W / img.width, H / img.height), w = img.width * r, h = img.height * r;
      x.fillStyle = "#ffffff"; x.fillRect(0, 0, W, H);
      x.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
      URL.revokeObjectURL(url);
      let q = 0.86, d = c.toDataURL("image/jpeg", q);
      while (d.length > 330000 && q > 0.45) { q -= 0.1; d = c.toDataURL("image/jpeg", q); }
      resolve(d);
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject({ code: "badimage" }); };
    img.src = url;
  });
}
async function uploadFoto(n, file) {
  const pm = document.getElementById("pm-" + n);
  const say = function (t, bad) { if (pm) { pm.textContent = t; pm.className = bad ? "errtext" : "fine"; } };
  if (!file) return;
  if (!/^image\//.test(file.type)) { say("File harus berupa gambar.", true); return; }
  say("Memproses foto…");
  try {
    const d = await toJpeg(file);
    await Promise.race([setDoc(doc(db, "config", "foto" + n), { data: d, at: new Date().toISOString() }), timeout(20000)]);
    say("Foto tersimpan.");
    if (pm) pm.className = "okt";
  } catch (e) {
    say(e && e.code === "badimage" ? "Foto tidak bisa dibaca. Coba file lain." : errMsg(e), true);
  }
}
async function wipeAll() {
  const ids = (S.votes || []).map(function (v) { return v.id; });
  for (let i = 0; i < ids.length; i += 400) {
    const b = writeBatch(db);
    ids.slice(i, i + 400).forEach(function (id) { b.delete(doc(db, "votes", id)); });
    await Promise.race([b.commit(), timeout(30000)]);
  }
  await setDoc(doc(db, "config", "reset"), { at: new Date().toISOString(), count: ids.length });
  S.wipe = false;
}
async function doLogin() {
  const email = document.getElementById("l-email").value.trim();
  const pass = document.getElementById("l-pass").value;
  const btn = document.getElementById("btn-login");
  if (btn) btn.disabled = true;
  S.lerr = ""; S.lemail = email;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    S.lerr = "Email atau kata sandi salah.";
    render();
  }
}

app.addEventListener("click", function (ev) {
  const t = ev.target.closest("[data-act]");
  if (!t) return;
  const a = t.getAttribute("data-act");
  if (a === "tab") { S.tab = t.getAttribute("data-tab"); S.aerr = ""; S.wipe = false; render(); }
  else if (a === "logout") { signOut(auth); }
  else if (a === "toggle") adminDo(function () { return Promise.race([setDoc(doc(db, "config", "status"), { open: !S.open, at: new Date().toISOString() }), timeout(10000)]); });
  else if (a === "wipe") { S.wipe = true; S.aerr = ""; render(); }
  else if (a === "wipe-no") { S.wipe = false; render(); }
  else if (a === "wipe-yes") {
    const inp = document.getElementById("wipe-in");
    if (!inp || inp.value.trim().toUpperCase() !== "RESET") return;
    adminDo(wipeAll);
  }
  else if (a === "delfoto") {
    const n = t.getAttribute("data-n");
    const pm = document.getElementById("pm-" + n);
    deleteDoc(doc(db, "config", "foto" + n)).then(function () {
      if (pm) { pm.textContent = "Foto dihapus."; pm.className = "fine"; }
    }).catch(function (e) { if (pm) { pm.textContent = errMsg(e); pm.className = "errtext"; } });
  }
});
app.addEventListener("input", function (ev) {
  if (ev.target && ev.target.id === "wipe-in") {
    const go = document.getElementById("wipe-go");
    if (go) go.disabled = S.busy || ev.target.value.trim().toUpperCase() !== "RESET";
  }
});
app.addEventListener("change", function (ev) {
  const t = ev.target;
  if (t && t.getAttribute && t.getAttribute("data-foto")) {
    uploadFoto(Number(t.getAttribute("data-foto")), t.files && t.files[0]);
    t.value = "";
  }
});
app.addEventListener("submit", function (ev) {
  ev.preventDefault();
  if (ev.target && ev.target.id === "formAtur") saveCfg();
  else if (ev.target && ev.target.id === "formLogin") doLogin();
});
window.addEventListener("hashchange", function () { S.aerr = ""; S.lerr = ""; S.wipe = false; render(); });

/* ---------- mulai ---------- */
render();
db = getFirestore(initializeApp(firebaseConfig));
auth = getAuth(db.app);
const onErr = function (e) { S.dberr = (e && e.code) || "error"; if (S.status === "ready") renderSoon(); };

onSnapshot(doc(db, "config", "paslon"), function (s) { S.cfg = s.exists() ? s.data() : null; S.dberr = ""; if (S.status === "ready") renderSoon(); }, onErr);
onSnapshot(doc(db, "config", "status"), function (s) { S.open = s.exists() ? s.data().open !== false : true; if (S.status === "ready") renderSoon(); }, onErr);
onSnapshot(doc(db, "config", "reset"), function (s) { S.reset = s.exists() ? s.data() : null; if (S.status === "ready") renderSoon(); }, onErr);
[1, 2, 3, 4].forEach(function (n) {
  onSnapshot(doc(db, "config", "foto" + n), function (s) {
    S.fotos[n - 1] = s.exists() && s.data().data ? s.data().data : "";
    const pv = document.getElementById("pv-" + n), del = document.getElementById("del-" + n);
    if (pv) pv.innerHTML = pvHTML(n - 1);
    if (del) del.hidden = !safeImg(S.fotos[n - 1]);
    if (S.status === "ready") renderSoon();
  }, onErr);
});
onSnapshot(collection(db, "votes"), function (q) {
  S.votes = q.docs.map(function (d) { return { id: d.id, paslon: d.data().paslon }; });
  S.dberr = "";
  if (S.votesLoaded) {
    q.docChanges().forEach(function (ch) {
      if (ch.type === "added") toast(Number(ch.doc.data().paslon));
    });
  } else if (!q.metadata.fromCache) {
    S.votesLoaded = true;
  }
  if (S.status === "ready") renderSoon();
}, onErr);

onAuthStateChanged(auth, function (u) {
  S.isAdmin = !!u;
  S.status = "ready";
  render();
});
</script>
